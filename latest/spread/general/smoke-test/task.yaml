summary: Verify the Node Exporter snap starts and serves metrics

environment:
  SNAP_NAME: node-exporter
  ENDPOINT: "http://localhost:9100/metrics"
  MAX_RETRIES: "12"
  INTERVAL: "5"

prepare: |
  snap install "${CRAFT_ARTIFACT}" --dangerous
  snap connect "${SNAP_NAME}:mount-observe"
  snap connect "${SNAP_NAME}:system-observe"
  snap restart "${SNAP_NAME}"

execute: |
  COUNT=0

  while [ "$COUNT" -lt "$MAX_RETRIES" ]; do
    METRICS="$(curl -sf "${ENDPOINT}")" || METRICS=""
    if printf '%s\n' "$METRICS" | grep -q "node_exporter_build_info"; then
      echo "Node exporter is serving metrics!"
      BLOCK_SIZE="$(stat -f -c %S /)"
      BLOCKS="$(stat -f -c %b /)"
      printf '%s\n' "$METRICS" | awk -v block_size="$BLOCK_SIZE" -v blocks="$BLOCKS" '
        /^node_filesystem_size_bytes\{/ && /mountpoint="\/"/ {
          found = 1
          if ($NF != block_size * blocks) {
            print "Root filesystem size does not match the host" > "/dev/stderr"
            exit 1
          }
        }
        END {
          if (!found) {
            print "Root filesystem size metric is missing" > "/dev/stderr"
            exit 1
          }
        }
      '
      exit 0
    fi
    echo "[${COUNT}] Waiting for node exporter to start..."
    COUNT=$((COUNT + 1))
    sleep "$INTERVAL"
  done

  echo "Node exporter did not serve metrics in time."
  exit 1

restore: |
  snap remove "${SNAP_NAME}" --purge || true

debug: |
  snap logs "${SNAP_NAME}" -n 50 || true
  journalctl -xe --no-pager | tail -50 || true
